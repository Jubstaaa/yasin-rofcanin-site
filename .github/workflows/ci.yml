name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run audit
            # `output: "export"` writes plain files to out/: no server to run.
            - run: bun run build
            # If the CDN base ever falls out of the build, every image 404s while
            # the build still looks perfectly healthy.
            - name: Sanity-check the export
              run: |
                  test -s out/index.html
                  test "$(find out -type f -name '*.html' | wc -l)" -ge 6
                  grep -q 'yasinrofcanin.fra1.cdn.digitaloceanspaces.com' out/index.html
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
