name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# Never cancel a release halfway through the upload.
concurrency:
    group: deploy-site
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    deploy:
        # Deploy secrets live in this environment, which only accepts main,
        # so a workflow on another branch cannot read them.
        environment: Production
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build
            - uses: Jubstaaa/deploy-actions/ssh@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            # Atomic release: the site switches to the new build in one rename, and
            # goes back to the previous one if it does not answer.
            - uses: Jubstaaa/deploy-actions/static@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  source-dir: out
                  site: yasinrofcanin-beta
                  health-url: https://beta.yasinrofcanin.com/
